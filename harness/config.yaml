# Codex audit configuration — kept identical across zero_shot and cve_hinted
# so the only difference between the two runs is the presence of the CVE hint.
codex:
  # The Codex CLI invocation. The runner calls:  codex exec --json ...
  # Adjust `bin` / `model` to match your Codex install.
  bin: codex
  model: gpt-5.4-codex
  reasoning_effort: high
  # Sandbox + approvals: Codex may read, build, and run inside the workdir only.
  # full_auto=true runs `codex exec --full-auto` (workspace-write + no
  # interactive approvals) so unattended runs don't stall. Set sandbox to
  # danger-full-access only if a build needs network/extra access AND you trust
  # the target; then the runner passes --dangerously-bypass-approvals-and-sandbox.
  sandbox: workspace-write
  full_auto: true
  approval_policy: never
  # Hard wall-clock budget per run (seconds). Matches the 2-hour audit budget
  # used for the agentic baselines in the Veritas paper.
  time_budget_seconds: 7200
  # Extra flags passed through verbatim to `codex exec`.
  extra_args: []

run:
  # Repo checkout is pinned to the sample commit and given to Codex read/build.
  # Both configurations get the same access.
  configurations: [zero_shot, cve_hinted]
  # How many independent repetitions per (sample, configuration). >1 lets you
  # measure run-to-run variance.
  repetitions: 1
  results_dir: ../results

judge:
  # Model used by the LLM-as-a-judge stage (judge/judge.py). Can differ from the
  # audit model; keep it fixed across all runs for comparability.
  model: gpt-5.4
  reasoning_effort: high

matcher:
  # Deterministic function-name matcher settings.
  normalize: true          # lowercase, strip, drop a leading project prefix
  allow_alias_match: true  # use ground_truth match_aliases
  # A finding "locates" the known vuln if its function (or file+line within the
  # function's known span) matches the ground-truth function or an alias.
