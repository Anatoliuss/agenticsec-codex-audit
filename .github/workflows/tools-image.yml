name: build-tools-image

# Builds the binary-analysis tools image (openhands/Dockerfile `tools` stage) and
# pushes it to this repo's GitHub Container Registry, so an HPC that only has
# Singularity can `singularity pull docker://ghcr.io/<owner>/<repo>-tools:latest`.
# After the first run, make the package public: GitHub -> your profile -> Packages
# -> <repo>-tools -> Package settings -> Change visibility -> Public.

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - openhands/Dockerfile
      - openhands/build_jq.sh
      - .github/workflows/tools-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-tools" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tools image
        uses: docker/build-push-action@v6
        with:
          context: openhands
          file: openhands/Dockerfile
          target: tools
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:latest

      - name: Show pull command
        run: |
          echo "On the HPC, pull it with:"
          echo "  singularity pull tools.sif docker://${{ steps.name.outputs.image }}:latest"
